services:
  # Unified Full-Stack Service (React + NestJS + yt-dlp + ffmpeg)
  - type: web
    name: youdown
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DOWNLOAD_FORMAT
        value: mp4
      - key: DOWNLOAD_QUALITY
        value: 720p
      - key: CACHE_RETENTION_MINUTES
        value: 30
      - key: MAX_VIDEO_DURATION_SECONDS
        value: 10800
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: WARP_ENABLED
        value: true
      # ipv4: YouTube flags WARP's IPv6 egress as bots; set dual to revert
      - key: WARP_IP_FAMILY
        value: ipv4
      # Fixed WARP identity (base64 wgcf-profile.conf), set in the dashboard only:
      # without it every cold start registers a new account and Cloudflare answers 429
      - key: WARP_PROFILE_B64
        sync: false
      - key: STREAM_TOKEN_SECRET
        generateValue: true
